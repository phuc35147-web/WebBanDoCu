<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hoàn tất đăng ký - Chợ Đồ Cũ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: #f1f5f9; }
        .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .auth-card { width: min(100%, 560px); border: 0; border-radius: 18px; overflow: hidden; }
        .auth-header { background: #0f172a; color: #fff; padding: 28px; }
    </style>
</head>
<body>
    <main class="auth-page">
        <section class="card auth-card shadow">
            <div class="auth-header">
                <a href="/" class="brand-logo text-white text-decoration-none"><i class="bi bi-recycle"></i> CHỢ ĐỒ CŨ</a>
                <h1 class="h3 mt-4 mb-2">Hoàn tất đăng ký</h1>
                <p class="mb-0 text-white-50">Nhập thông tin để tạo tài khoản của bạn.</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <div class="alert alert-light border d-flex justify-content-between align-items-center">
                    <span>Số điện thoại: <strong id="phoneDisplay"></strong></span>
                    <button id="changePhoneButton" class="btn btn-sm btn-outline-secondary" type="button">Sửa số điện thoại</button>
                </div>
                <form id="detailsForm">
                    <div class="mb-3">
                        <label class="form-label">Họ và tên</label>
                        <input id="registerName" class="form-control" required autocomplete="name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input id="registerEmail" type="email" class="form-control" required autocomplete="email">
                    </div>
                    <div class="mb-3">
                        <button id="sendEmailOtpButton" class="btn btn-outline-primary w-100" type="button">Gửi mã xác thực email</button>
                    </div>
                    <div id="emailOtpGroup" class="mb-3 d-none">
                        <label class="form-label" for="emailOtpCode">Mã xác thực email</label>
                        <div class="input-group">
                            <input id="emailOtpCode" class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
                            <button id="verifyEmailOtpButton" class="btn btn-outline-primary" type="button">Xác thực</button>
                        </div>
                    </div>
                    <input id="emailOtpToken" type="hidden">
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu (ít nhất 8 ký tự, gồm chữ và số)</label>
                        <input id="registerPassword" type="password" minlength="8" class="form-control" required autocomplete="new-password">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tỉnh/thành phố</label>
                        <select id="registerProvince" class="form-select" required>
                            <option value="">Đang tải tỉnh/thành phố...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phường/xã</label>
                        <select id="registerWard" class="form-select" required disabled>
                            <option value="">Chọn tỉnh/thành phố trước</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Địa chỉ chi tiết</label>
                        <input id="registerAddress" class="form-control" required autocomplete="street-address">
                    </div>
                    <div class="form-check my-3">
                        <input class="form-check-input" type="checkbox" id="registerConsent" required>
                        <label class="form-check-label small" for="registerConsent">Tôi đã đọc và đồng ý với <a href="/terms.html" target="_blank" rel="noopener">Điều khoản sử dụng</a> và <a href="/privacy.html" target="_blank" rel="noopener">Chính sách bảo mật</a>, bao gồm việc thu thập và xử lý email, số điện thoại, địa chỉ của tôi.</label>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Tạo tài khoản</button>
                </form>
                <div id="authMessage" class="alert d-none mt-3 mb-0"></div>
            </div>
        </section>
    </main>
    <script>
        const phone = sessionStorage.getItem('registrationPhone');
        const phoneDisplay = document.getElementById('phoneDisplay');
        const message = document.getElementById('authMessage');
        const registerEmail = document.getElementById('registerEmail');
        const emailOtpGroup = document.getElementById('emailOtpGroup');
        const emailOtpToken = document.getElementById('emailOtpToken');
        if (!phone || !/^0\d{9}$/.test(phone)) window.location.replace('/auth.html?mode=register');
        phoneDisplay.textContent = phone || '';

        function showMessage(text, type = 'danger') {
            message.textContent = text;
            message.className = `alert alert-${type} mt-3 mb-0`;
        }
        async function request(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Yêu cầu không thành công.');
            return data;
        }
        async function loadProvinces() {
            const select = document.getElementById('registerProvince');
            try {
                const response = await fetch('https://provinces.open-api.vn/api/v2/p/');
                if (!response.ok) throw new Error('Không thể tải danh sách tỉnh/thành phố.');
                const provinces = await response.json();
                select.innerHTML = '<option value="">-- Chọn tỉnh/thành phố --</option>';
                provinces.sort((a, b) => a.name.localeCompare(b.name, 'vi')).forEach(province => {
                    const option = document.createElement('option');
                    option.value = province.code;
                    option.textContent = province.name;
                    select.appendChild(option);
                });
            } catch (error) {
                select.innerHTML = '<option value="">Không tải được danh sách</option>';
                showMessage(error.message);
            }
        }
        async function loadWards(code) {
            const select = document.getElementById('registerWard');
            select.disabled = true;
            select.innerHTML = '<option value="">Đang tải phường/xã...</option>';
            if (!code) {
                select.innerHTML = '<option value="">Chọn tỉnh/thành phố trước</option>';
                return;
            }
            try {
                const response = await fetch(`https://provinces.open-api.vn/api/v2/p/${encodeURIComponent(code)}?depth=2`);
                if (!response.ok) throw new Error('Không thể tải danh sách phường/xã.');
                const province = await response.json();
                // API v2 (sau sáp nhập 07/2025) quản lý trực tiếp danh sách phường/xã
                // trong thuộc tính wards. API v1 cũ trả về districts nhưng wards có thể null.
                let wards = Array.isArray(province.wards) ? province.wards : [];

                // Fallback để tương thích nếu API trả cấu trúc cũ.
                if (!wards.length && Array.isArray(province.districts)) {
                    province.districts.forEach(district => {
                        (district.wards || []).forEach(ward => {
                            wards.push({ ...ward, district_name: district.name });
                        });
                    });
                }

                if (!wards.length) {
                    throw new Error('Tỉnh/thành này chưa tải được danh sách phường/xã.');
                }

                select.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
                wards.sort((a, b) => a.name.localeCompare(b.name, 'vi')).forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward.name;
                    option.textContent = ward.name;
                    select.appendChild(option);
                });
                select.disabled = false;
            } catch (error) {
                select.innerHTML = '<option value="">Không tải được danh sách</option>';
                showMessage(error.message);
            }
        }
        document.getElementById('changePhoneButton').onclick = () => {
            sessionStorage.removeItem('registrationPhone');
            window.location.href = '/auth.html?mode=register';
        };
        document.getElementById('sendEmailOtpButton').onclick = async event => {
            const button = event.currentTarget;
            button.disabled = true;
            emailOtpToken.value = '';
            document.getElementById('emailOtpCode').value = '';
            try {
                const data = await request('/api/auth/email-otp/send', {
                    email: registerEmail.value.trim(),
                    purpose: 'register'
                });
                emailOtpGroup.classList.remove('d-none');
                showMessage(data.message, 'success');
            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
            }
        };
        document.getElementById('verifyEmailOtpButton').onclick = async event => {
            const button = event.currentTarget;
            button.disabled = true;
            try {
                const data = await request('/api/auth/email-otp/verify', {
                    email: registerEmail.value.trim(),
                    purpose: 'register',
                    code: document.getElementById('emailOtpCode').value.trim()
                });
                emailOtpToken.value = data.verificationToken;
                showMessage(data.message, 'success');
            } catch (error) {
                emailOtpToken.value = '';
                showMessage(error.message);
            } finally {
                button.disabled = false;
            }
        };
        registerEmail.addEventListener('input', () => {
            emailOtpToken.value = '';
            document.getElementById('emailOtpCode').value = '';
        });
        document.getElementById('registerProvince').onchange = event => loadWards(event.target.value);
        document.getElementById('detailsForm').onsubmit = async event => {
            event.preventDefault();
            try {
                if (!emailOtpToken.value) throw new Error('Vui lòng xác thực email trước khi tạo tài khoản.');
                const province = document.getElementById('registerProvince');
                const ward = document.getElementById('registerWard');
                const data = await request('/api/auth/register', {
                    hoTen: document.getElementById('registerName').value.trim(),
                    email: document.getElementById('registerEmail').value.trim(),
                    soDienThoai: phone,
                    matKhau: document.getElementById('registerPassword').value,
                    tinhThanh: province.options[province.selectedIndex]?.textContent.trim(),
                    phuongXa: ward.value.trim(),
                    quanHuyen: null,
                    diaChiChiTiet: document.getElementById('registerAddress').value.trim(),
                    emailOtpToken: emailOtpToken.value,
                    dongYDieuKhoan: document.getElementById('registerConsent').checked
                });
                sessionStorage.removeItem('registrationPhone');
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (error) {
                showMessage(error.message);
            }
        };
        loadProvinces();
    </script>
<script src="/js/site-config.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
