<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập quản trị - Chợ Đồ Cũ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">
    <main class="container py-5" style="max-width: 480px">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-4 text-center">Đăng nhập quản trị</h1>
                <div id="error" class="alert alert-danger d-none"></div>
                <form id="loginForm">
                    <label class="form-label">Email quản trị</label>
                    <input id="email" type="email" class="form-control mb-3" required autocomplete="username">
                    <label class="form-label">Mật khẩu</label>
                    <input id="password" type="password" class="form-control mb-4" required autocomplete="current-password">
                    <div id="otpGroup" class="d-none mb-4">
                        <label class="form-label" for="otp">Mã xác thực 2 bước (6 số)</label>
                        <input id="otp" class="form-control" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code">
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                </form>
                <a href="/" class="d-block text-center mt-3">Về trang chủ</a>
            </div>
        </div>
    </main>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async event => {
            event.preventDefault();
            const error = document.getElementById('error');
            error.classList.add('d-none');
            const response = await fetch('/api/admin/auth/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value, otp: document.getElementById('otp').value })
            });
            const data = await response.json();
            if (!response.ok) {
                if (data.needOtp) { document.getElementById('otpGroup').classList.remove('d-none'); document.getElementById('otp').focus(); }
                error.textContent = data.message || 'Đăng nhập thất bại.';
                error.classList.remove('d-none');
                return;
            }
            localStorage.setItem('adminToken', data.token);
            localStorage.setItem('adminUser', JSON.stringify(data.user));
            location.href = '/admin.html';
        });
    </script>
<script src="/js/site-config.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
