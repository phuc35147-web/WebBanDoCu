<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chi tiết tin đăng - Chợ Đồ Cũ</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
<link rel="stylesheet" href="/css/style.css">
    <meta name="description" content="Mua bán đồ cũ uy tín, đăng tin miễn phí tại Chợ Đồ Cũ.">
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="Chợ Đồ Cũ">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="main-header" style="min-height:auto;background-position:center;height:auto;">
  <div class="container d-flex justify-content-between align-items-center py-3">
    <a href="/" class="brand-logo text-decoration-none text-white fw-bold d-flex align-items-center gap-2"><i class="bi bi-recycle"></i> CHỢ ĐỒ CŨ</a>
    <a href="/" class="btn btn-warning fw-bold rounded-pill px-4">← Về trang chủ</a>
  </div>
</header>

<main class="container py-4 product-detail-page">
  <div id="productDetail"><div class="text-center text-muted py-5">Đang tải tin đăng...</div></div>
  <section id="similarSection" class="similar-section d-none">
    <div class="d-flex justify-content-between align-items-center mb-3"><div><span class="section-kicker">GỢI Ý</span><h2 class="fw-bold m-0">Tin đăng tương tự</h2></div></div>
    <div class="row g-3" id="similarProducts"></div>
  </section>
</main>

<script>
let currentProduct=null;
let currentOtherUser=null;
let currentChatProduct=null;

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function money(v){return Number(v||0).toLocaleString('vi-VN')+' đ';}
function date(v){const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('vi-VN');}
function phoneReveal(masked){
 const value=String(masked||'');
 if(!value)return 'Liên hệ qua tin nhắn';
 return `<button class="btn btn-link btn-sm p-0 align-baseline" type="button" aria-label="Hiện số điện thoại người bán" onclick="toggleSellerPhone(this)" data-visible="false" data-masked="${esc(value)}">${esc(value)} · Bấm để hiện</button>`;
}
async function toggleSellerPhone(button){
 if(button.dataset.visible==='true'){
  button.dataset.visible='false';
  button.textContent=`${button.dataset.masked} · Bấm để hiện`;
  button.setAttribute('aria-label','Hiện số điện thoại người bán');
  return;
 }
 const token=localStorage.getItem('token');
 if(!token){location.href='/auth.html?mode=login';return;}
 if(!button.dataset.phone){
  try{
   const r=await fetch(`/api/products/${encodeURIComponent(currentProduct.MaSanPham)}/phone`,{headers:{Authorization:`Bearer ${token}`}});
   const d=await r.json();
   if(!r.ok)throw new Error(d.message||'Không lấy được số điện thoại.');
   button.dataset.phone=d.phone;
  }catch(e){alert(e.message);return;}
 }
 button.dataset.visible='true';
 button.textContent=`${button.dataset.phone} · Ẩn`;
 button.setAttribute('aria-label','Ẩn số điện thoại người bán');
}
function productCard(p){return `<div class="col-6 col-md-3"><a href="/product-detail.html?id=${encodeURIComponent(p.MaSanPham)}" class="text-decoration-none text-dark"><div class="card product-card h-100"><img class="product-img" src="${esc(p.HinhAnh||'/uploads/default.jpg')}" onerror="this.src='/uploads/default.jpg'"><div class="card-body"><span class="badge bg-primary-subtle text-primary mb-2">${esc(p.TenDanhMuc||'Đồ cũ')}</span><h6 class="fw-bold text-truncate">${esc(p.TenSanPham)}</h6><div class="text-danger fw-bold">${money(p.GiaBan)}</div><small class="text-muted"><i class="bi bi-person"></i> ${esc(p.TenNguoiBan||'Người bán')}</small></div></div></a></div>`;}

async function loadProduct(){
 const id=new URLSearchParams(location.search).get('id');
 const box=document.getElementById('productDetail');
 if(!id){box.innerHTML='<div class="alert alert-warning">Không xác định được tin đăng.</div>';return;}
 try{
  const _t=localStorage.getItem('token');const r=await fetch('/api/products/'+encodeURIComponent(id),_t?{headers:{Authorization:'Bearer '+_t}}:undefined);const p=await r.json();if(!r.ok)throw new Error(p.message||'Không tìm thấy tin đăng.');
  currentProduct=p; currentOtherUser=p.MaNguoiBan; currentChatProduct=p.MaSanPham; document.title=p.TenSanPham+' - Chợ Đồ Cũ';
  if(_t)fetch('/api/products/'+encodeURIComponent(p.MaSanPham)+'/viewed',{method:'POST',headers:{Authorization:'Bearer '+_t}}).then(r=>{if(!r.ok)throw new Error('Không ghi nhận được lịch sử xem tin.');}).catch(e=>console.error('RECENT VIEW:',e));
   const imgs=(Array.isArray(p.HinhAnhs)&&p.HinhAnhs.length?p.HinhAnhs:[p.HinhAnh||'/uploads/default.jpg']);
   const isVip = Boolean(p.LaTinVIP);
   const isVerified = Boolean(p.NguoiBanDaXacMinh);
   box.innerHTML=`
   <div class="product-detail-shell p-3 p-md-4">
    <div class="row g-4">
     <div class="col-lg-6">
       <div class="detail-gallery">
         <img id="mainProductImage" class="detail-main-image" src="${esc(imgs[0])}" onerror="this.src='/uploads/default.jpg'" alt="${esc(p.TenSanPham)}">
         <div class="detail-thumbs">${imgs.map((im,i)=>`<img class="detail-thumb ${i===0?'active':''}" src="${esc(im)}" onclick="changeImage(this,'${esc(im)}')" onerror="this.src='/uploads/default.jpg'">`).join('')}</div>
         ${p.VideoUrl ? `
         <div class="mt-3 p-2 bg-light rounded border">
           <div class="fw-semibold small mb-1 text-danger"><i class="bi bi-play-circle-fill me-1"></i>Video tình trạng thực tế:</div>
           <video src="${esc(p.VideoUrl)}" controls class="w-100 rounded" style="max-height: 260px; background: #000;"></video>
         </div>` : ''}
       </div>
     </div>
     <div class="col-lg-6"><div class="detail-info">
       <div class="d-flex align-items-center gap-2 mb-2">
         <span class="detail-category">${esc(p.TenDanhMuc||'Đồ cũ')}</span>
         ${isVip ? '<span class="badge bg-warning text-dark fw-bold px-2 py-1 shadow-sm"><i class="bi bi-star-fill text-danger me-1"></i>VIP NỔI BẬT</span>' : ''}
       </div>
       <h1 class="detail-title">${esc(p.TenSanPham)}</h1>
       <div class="detail-price">${money(p.GiaBan)}</div>
       <div class="detail-meta-grid">
         <div class="detail-meta"><small>Tình trạng</small><strong>${esc(p.TinhTrang||'Đang cập nhật')}</strong></div>
         <div class="detail-meta"><small>Đăng ngày</small><strong>${date(p.NgayDang)||'Đang cập nhật'}</strong></div>
         <div class="detail-meta"><small>Lượt xem</small><strong>${Number(p.LuotXem||0)}</strong></div>
         <div class="detail-meta"><small>Khu vực</small><strong>${esc(p.DiaChiXemHang||'Đang cập nhật')}</strong></div>
       </div>
       <div class="seller-box">
         <div class="d-flex align-items-center gap-3">
           <div class="seller-avatar">${esc((p.TenNguoiBan||'N').trim().charAt(0).toUpperCase())}</div>
           <div>
             <div class="fw-bold fs-5 d-flex align-items-center flex-wrap gap-1">
               <a href="/seller.html?id=${Number(p.MaNguoiBan)}" class="text-reset text-decoration-none">${esc(p.TenNguoiBan||'Người bán')}</a>
               ${isVerified ? '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill fs-6 px-2 py-1"><i class="bi bi-patch-check-fill me-1"></i>Đã xác minh</span>' : '<span class="badge bg-secondary-subtle text-secondary rounded-pill fs-6 px-2 py-1">Chưa xác minh</span>'}
             </div>
             <div class="text-muted small">Tham gia từ: ${p.NguoiBanNgayTao ? date(p.NguoiBanNgayTao) : 'Thành viên Chợ Đồ Cũ'}</div>
             <div class="text-warning fw-semibold mt-1">${Number(p.TongDanhGia||0)>0?`★ ${Number(p.SoSaoTrungBinh).toFixed(1)} / 5 · ${Number(p.TongDanhGia)} đánh giá`:'Chưa có đánh giá'}</div>
           </div>
         </div>
         <div class="small text-muted mt-3"><i class="bi bi-geo-alt me-1"></i>${esc(p.DiaChiXemHang||'Chưa cập nhật')} · <i class="bi bi-telephone me-1"></i>${phoneReveal(p.SdtNguoiBanAn)}</div>
       </div>
       <div class="detail-action-row"><button class="detail-chat-btn" onclick="openSellerChat()"><i class="bi bi-chat-dots me-2"></i>Chat với người bán</button><button class="detail-save-btn" onclick="toggleSave()"><i class="bi bi-heart me-2"></i>Lưu tin</button></div>
     </div></div>
     <div class="col-12"><div class="detail-description"><h3 class="fw-bold">Mô tả sản phẩm</h3><p class="mb-0" style="white-space:pre-line">${esc(p.MoTa||'Người bán chưa thêm mô tả.')}</p></div></div>
    <div class="col-12">
      <div class="detail-description">
        <h3 class="fw-bold">Đánh giá người bán</h3>
        <div>${(p.DanhGiaNguoiBan||[]).length?p.DanhGiaNguoiBan.map(review=>`<div class="border-bottom py-2"><div class="text-warning">${'★'.repeat(Number(review.SoSao))}${'☆'.repeat(5-Number(review.SoSao))}</div><strong>${esc(review.TenNguoiMua)}</strong><small class="text-muted ms-2">${date(review.NgayDanhGia)}</small><p class="mb-0">${esc(review.NoiDung||'Không có bình luận.')}</p></div>`).join(''):'<p class="text-muted">Người bán chưa có đánh giá.</p>'}</div>
      </div>
        <form id="reviewForm" class="mt-3">
          <h5>Chia sẻ trải nghiệm sau khi trao đổi với người bán</h5>
          <div class="row g-2"><div class="col-md-3"><label class="form-label" for="reviewRating">Số sao</label><select id="reviewRating" class="form-select" required><option value="">Chọn sao</option><option value="5">5 sao</option><option value="4">4 sao</option><option value="3">3 sao</option><option value="2">2 sao</option><option value="1">1 sao</option></select></div><div class="col-md-9"><label class="form-label" for="reviewComment">Bình luận (không bắt buộc)</label><input id="reviewComment" class="form-control" maxlength="1000"></div></div>
          <div class="form-text">Chỉ người đã mua hàng và được người bán xác nhận mới đánh giá được.</div><button class="btn btn-primary mt-2" type="submit">Gửi đánh giá</button><span id="reviewMessage" class="small ms-2" role="status"></span>
        </form>
      <div class="text-end mt-2"><button id="reportToggle" class="btn btn-sm btn-outline-danger" type="button">Báo cáo tin đăng</button></div>
      <form id="reportForm" class="border rounded p-3 mt-2 d-none">
        <h5 class="mb-3">Báo cáo tin đăng vi phạm</h5>
        <label class="form-label" for="reportReason">Lý do</label>
        <select id="reportReason" class="form-select mb-2" required><option value="">Chọn lý do</option><option>Hàng giả</option><option>Hàng cấm</option><option>Thông tin sai sự thật</option><option>Nghi ngờ lừa đảo</option><option>Vi phạm bản quyền / ảnh ăn cắp</option><option>Lý do khác</option></select>
        <label class="form-label" for="reportDetails">Thông tin bổ sung</label><textarea id="reportDetails" class="form-control" maxlength="1000" rows="3"></textarea>
        <button class="btn btn-danger mt-2" type="submit">Gửi báo cáo</button><span id="reportMessage" class="small ms-2" role="status"></span>
      </form>
    </div>
   </div>
  </div>`;
  loadSimilar(p.MaDanhMuc,p.MaSanPham);
  initSaveState(p.MaSanPham);
  document.getElementById('reviewForm').addEventListener('submit', submitReview);
  document.getElementById('reportToggle').addEventListener('click',()=>document.getElementById('reportForm').classList.toggle('d-none'));
  document.getElementById('reportForm').addEventListener('submit', submitReport);
 }catch(e){box.innerHTML=`<div class="alert alert-danger">${esc(e.message)}</div>`;}
}
function changeImage(el,src){document.getElementById('mainProductImage').src=src;document.querySelectorAll('.detail-thumb').forEach(x=>x.classList.remove('active'));el.classList.add('active');}
async function loadSimilar(cat,id){try{const r=await fetch('/api/products?maDanhMuc='+encodeURIComponent(cat));const a=await r.json();const items=(Array.isArray(a)?a:[]).filter(x=>Number(x.MaSanPham)!==Number(id)).slice(0,5);if(!items.length)return;document.getElementById('similarProducts').innerHTML=items.map(productCard).join('');document.getElementById('similarSection').classList.remove('d-none');}catch(e){}}
async function submitReview(event){event.preventDefault();const token=localStorage.getItem('token');if(!token){location.href='/auth.html?mode=login';return;}const message=document.getElementById('reviewMessage');try{const response=await fetch(`/api/products/${currentProduct.MaSanPham}/reviews`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({soSao:document.getElementById('reviewRating').value,noiDung:document.getElementById('reviewComment').value})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Không gửi được đánh giá.');await loadProduct();const updatedMessage=document.getElementById('reviewMessage');updatedMessage.className='small ms-2 text-success';updatedMessage.textContent=data.message;}catch(error){message.className='small ms-2 text-danger';message.textContent=error.message;}}
async function submitReport(event){event.preventDefault();const token=localStorage.getItem('token');if(!token){location.href='/auth.html?mode=login';return;}const message=document.getElementById('reportMessage');try{const response=await fetch(`/api/products/${currentProduct.MaSanPham}/reports`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({loaiViPham:document.getElementById('reportReason').value,chiTiet:document.getElementById('reportDetails').value})});const data=await response.json();if(!response.ok)throw new Error(data.message||'Không gửi được báo cáo.');message.className='small ms-2 text-success';message.textContent=data.message;document.getElementById('reportForm').reset();}catch(error){message.className='small ms-2 text-danger';message.textContent=error.message;}}
let isSaved=false;
function paintSave(){const b=document.querySelector('.detail-save-btn');if(!b)return;b.innerHTML=`<i class="bi ${isSaved?'bi-heart-fill':'bi-heart'} me-2"></i>${isSaved?'Đã lưu':'Lưu tin'}`;}
async function initSaveState(pid){const token=localStorage.getItem('token');if(!token)return;try{const r=await fetch('/api/favorites/ids',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const d=await r.json();isSaved=(d.ids||[]).map(Number).includes(Number(pid));paintSave();}catch(_){}}
async function toggleSave(){const token=localStorage.getItem('token');if(!token){location.href='/auth.html?mode=login';return;}try{const r=await fetch('/api/favorites/'+encodeURIComponent(currentProduct.MaSanPham),{method:isSaved?'DELETE':'POST',headers:{Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok)throw new Error(d.message||'Không thể lưu tin.');isSaved=!isSaved;paintSave();}catch(e){alert(e.message);}}

let chatStreamAbort = null;

function getCurrentUser() {
    try {
        return JSON.parse(
            localStorage.getItem('user') || '{}'
        );
    } catch (_) {
        return {};
    }
}

function getMyId() {
    const u = getCurrentUser();

    return Number(
        u.maNguoiDung ||
        u.MaNguoiDung ||
        u.id ||
        u.userId ||
        0
    );
}

function chatAvatar(name, img) {
    const letter = esc(
        (name || 'N')
            .trim()
            .charAt(0)
            .toUpperCase()
    );

    return img
        ? `<img src="${esc(img)}"
             onerror="this.parentElement.innerHTML='${letter}'">`
        : letter;
}

function closeChat() {
    chatStreamAbort?.abort();
    chatStreamAbort = null;

    document
        .querySelector('.seller-chat-panel')
        ?.remove();
}


async function openSellerChat() {

    const token = localStorage.getItem('token');

    if (!token) {
        location.href =
            '/auth.html?mode=login';

        return;
    }

    if (
        Number(currentOtherUser) ===
        getMyId()
    ) {
        alert(
            'Bạn không thể chat với chính mình.'
        );

        return;
    }

    closeChat();

    const name =
        currentProduct.TenNguoiBan ||
        'Người bán';

    const panel =
        document.createElement('div');

    panel.className =
        'seller-chat-panel';

    panel.innerHTML = `
        <div class="seller-chat-header">

            <div class="seller-chat-person flex-grow-1">

                <div class="seller-chat-avatar">
                    ${chatAvatar(
                        name,
                        currentProduct.AnhNguoiBan
                    )}
                </div>

                <div class="min-w-0">

                    <div class="fw-bold text-truncate">
                        Chat với ${esc(name)}
                    </div>

                    <div class="seller-chat-status">
                        <span class="online-dot"></span>
                        Đang trò chuyện
                    </div>

                </div>

            </div>

            <button
                class="btn btn-sm text-white"
                onclick="closeChat()"
                title="Đóng">

                <i class="bi bi-x-lg"></i>

            </button>

        </div>


        <a
            class="seller-chat-product"
            href="/product-detail.html?id=${encodeURIComponent(currentChatProduct)}">

            <img
                src="${esc(
                    currentProduct.HinhAnh ||
                    '/uploads/default.jpg'
                )}"
                onerror="this.src='/uploads/default.jpg'">

            <div class="min-w-0 flex-grow-1">

                <div class="small text-muted">
                    Sản phẩm đang trao đổi
                </div>

                <div class="seller-chat-product-title">
                    ${esc(
                        currentProduct.TenSanPham
                    )}
                </div>

                <div class="seller-chat-product-price">
                    ${money(
                        currentProduct.GiaBan
                    )}
                </div>

            </div>

            <i class="bi bi-chevron-right"></i>

        </a>


        <div
            id="chatBody"
            class="seller-chat-body">

            <div class="chat-empty">
                Đang tải cuộc trò chuyện...
            </div>

        </div>


        <form
            class="seller-chat-compose"
            onsubmit="sendChat(event)">

            <button type="button" id="detailImageButton" title="Gửi ảnh"><i class="bi bi-image"></i></button>
            <input id="detailImage" type="file" accept="image/jpeg,image/png,image/webp" hidden>
            <input
                id="chatInput"
                maxlength="2000"
                placeholder="Nhập tin nhắn..."
                autocomplete="off">

            <button type="button" id="detailBargainButton" title="Trả giá"><i class="bi bi-currency-exchange"></i></button>
            <button type="submit" title="Gửi">

                <i class="bi bi-send"></i>

            </button>

        </form>
    `;

    document.body.appendChild(panel);
    document.getElementById('detailImageButton')?.addEventListener('click', () => document.getElementById('detailImage')?.click());
    document.getElementById('detailImage')?.addEventListener('change', () => sendChat(new Event('submit')));
    document.getElementById('detailBargainButton')?.addEventListener('click', async () => {
        if (!currentProduct?.GiaBan) return alert('Không có giá tin đăng để tham khảo.');
        const raw = prompt('Nhập giá bạn muốn trả (VNĐ):', String(Math.floor(Number(currentProduct.GiaBan) * 0.9)));
        if (raw === null) return;
        const offer = Number(String(raw).replace(/[^\d]/g, ''));
        if (!Number.isFinite(offer) || offer <= 0) return alert('Giá trả không hợp lệ.');
        await sendSpecialSellerMessage({ offer });
    });

    await loadChat();

    connectSellerChatRealtime();

    document
        .getElementById('chatInput')
        ?.focus();
}


function renderSellerMessage(m) {

    const me =
        Number(m.MaNguoiGui) ===
        getMyId();

    const user =
        getCurrentUser();

    const name = me
        ? (
            user.hoTen ||
            user.HoTen ||
            'Bạn'
        )
        : (
            m.TenNguoiGui ||
            currentProduct.TenNguoiBan ||
            'Người bán'
        );

    const rawDate = String(m.NgayGui || '').trim();
    const normalizedDate = rawDate.includes(' ') && rawDate.includes('-')
        ? rawDate.replace(' ', 'T')
        : rawDate;
    const messageDate = normalizedDate ? new Date(normalizedDate) : null;
    const messageTime = !messageDate || Number.isNaN(messageDate.getTime())
        ? ''
        : messageDate.toLocaleTimeString('vi-VN', {
            hour: '2-digit',
            minute: '2-digit',
            hour12: false,
            timeZone: 'Asia/Ho_Chi_Minh'
        });
    const content = m.LoaiTinNhan === 'image'
        ? `<a href="${esc(m.NoiDung)}" target="_blank" rel="noopener"><img class="seller-chat-image" src="${esc(m.NoiDung)}" alt="Ảnh gửi trong chat" loading="lazy"></a>`
        : m.LoaiTinNhan === 'offer'
            ? `<div class="seller-chat-offer"><i class="bi bi-currency-exchange me-1"></i>Trả giá: <strong>${Number(m.GiaDeXuat || 0).toLocaleString('vi-VN')} đ</strong></div>`
            : esc(m.NoiDung);

    return `
        <div
            class="seller-chat-row ${me ? 'me' : 'them'}"
            data-message-id="${Number(m.MaTinNhan)}">

            <div class="seller-chat-wrap">

                <div class="seller-chat-name">
                    ${esc(name)}
                </div>

                <div class="chat-bubble ${me ? 'me' : 'them'}">

                    ${content}

                    <div class="seller-chat-meta">

                        <span>
                            ${messageTime}
                        </span>

                        ${
                            me
                                ? `<span>
                                    ${
                                        Number(m.DaDoc) === 1
                                            ? '✓✓ Đã xem'
                                            : '✓ Đã gửi'
                                    }
                                   </span>`
                                : ''
                        }

                    </div>

                </div>

            </div>

        </div>
    `;
}


function sellerChatDayKey(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    const parts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Ho_Chi_Minh',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
    }).formatToParts(date);
    return `${parts.find(x => x.type === 'year')?.value}-${parts.find(x => x.type === 'month')?.value}-${parts.find(x => x.type === 'day')?.value}`;
}


function sellerChatDayLabel(value) {
    const date = new Date(value);
    return Number.isNaN(date.getTime())
        ? ''
        : date.toLocaleDateString('vi-VN', {
            weekday: 'long',
            day: '2-digit',
            month: '2-digit',
            year: 'numeric',
            timeZone: 'Asia/Ho_Chi_Minh'
        });
}


async function loadChat() {

    const token =
        localStorage.getItem('token');

    const body =
        document.getElementById('chatBody');

    if (!body) return;

    try {

        const r = await fetch(
            `/api/messages?userId=${
                encodeURIComponent(
                    currentOtherUser
                )
            }&productId=${
                encodeURIComponent(
                    currentChatProduct
                )
            }`,
            {
                headers: {
                    Authorization:
                        `Bearer ${token}`
                }
            }
        );

        const a = await r.json();

        if (!r.ok) {
            throw new Error(
                a.message ||
                'Không tải được tin nhắn.'
            );
        }

        body.innerHTML = a.length
            ? a.map((message, index) => {
                const day = sellerChatDayKey(message.NgayGui);
                const previousDay = index
                    ? sellerChatDayKey(a[index - 1].NgayGui)
                    : '';
                const separator = day && day !== previousDay
                    ? `<div class="chat-day-separator" data-day-key="${day}"><span>${esc(sellerChatDayLabel(message.NgayGui))}</span></div>`
                    : '';
                return `${separator}${renderSellerMessage(message)}`;
            }).join('')
            : `
                <div class="chat-empty">
                    <i class="bi bi-chat-dots fs-1 d-block mb-2"></i>
                    Hãy bắt đầu cuộc trò chuyện về sản phẩm này.
                </div>
            `;

        body.scrollTop =
            body.scrollHeight;

        await fetch(
            '/api/messages/read',
            {
                method: 'PATCH',

                headers: {
                    'Content-Type':
                        'application/json',

                    Authorization:
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    userId:
                        currentOtherUser,

                    productId:
                        currentChatProduct
                })
            }
        ).catch(() => {});

    } catch (e) {

        body.innerHTML =
            `<div class="alert alert-danger">
                ${esc(e.message)}
            </div>`;
    }
}


function appendSellerMessage(m) {

    if (
        !currentProduct ||
        Number(m.MaSanPham) !==
        Number(currentChatProduct)
    ) {
        return;
    }

    const sameUsers =
        (
            Number(m.MaNguoiGui) ===
                getMyId() &&

            Number(m.MaNguoiNhan) ===
                Number(currentOtherUser)
        )

        ||

        (
            Number(m.MaNguoiGui) ===
                Number(currentOtherUser) &&

            Number(m.MaNguoiNhan) ===
                getMyId()
        );

    if (!sameUsers) return;

    if (
        document.querySelector(
            `#chatBody [data-message-id="${Number(
                m.MaTinNhan
            )}"]`
        )
    ) {
        return;
    }

    const body =
        document.getElementById(
            'chatBody'
        );

    const empty =
        body?.querySelector(
            '.chat-empty'
        );

    if (empty) {
        empty.remove();
    }

    const day = sellerChatDayKey(m.NgayGui);
    const hasDaySeparator = day && body?.querySelector(
        `.chat-day-separator[data-day-key="${day}"]`
    );
    const separator = day && !hasDaySeparator
        ? `<div class="chat-day-separator" data-day-key="${day}"><span>${esc(sellerChatDayLabel(m.NgayGui))}</span></div>`
        : '';

    body?.insertAdjacentHTML(
        'beforeend',
        `${separator}${renderSellerMessage(m)}`
    );

    if (body) {
        body.scrollTop =
            body.scrollHeight;
    }

    if (
        Number(m.MaNguoiGui) !==
        getMyId()
    ) {

        fetch(
            '/api/messages/read',
            {
                method: 'PATCH',

                headers: {
                    'Content-Type':
                        'application/json',

                    Authorization:
                        `Bearer ${
                            localStorage.getItem(
                                'token'
                            )
                        }`
                },

                body: JSON.stringify({
                    userId:
                        currentOtherUser,

                    productId:
                        currentChatProduct
                })
            }
        ).catch(() => {});
    }
}


async function connectSellerChatRealtime() {

    chatStreamAbort?.abort();

    chatStreamAbort =
        new AbortController();

    const token =
        localStorage.getItem('token');

    while (
        !chatStreamAbort.signal.aborted &&
        document.querySelector(
            '.seller-chat-panel'
        )
    ) {

        try {

            const r = await fetch(
                '/api/messages/stream',
                {
                    headers: {
                        Authorization:
                            `Bearer ${token}`,

                        Accept:
                            'text/event-stream'
                    },

                    cache: 'no-store',

                    signal:
                        chatStreamAbort.signal
                }
            );

            if (!r.ok) {
                throw new Error(
                    'stream ' + r.status
                );
            }

            const reader =
                r.body.getReader();

            const decoder =
                new TextDecoder();

            let buffer = '';

            while (
                !chatStreamAbort.signal.aborted
            ) {

                const {
                    value,
                    done
                } = await reader.read();

                if (done) break;

                buffer += decoder.decode(
                    value,
                    {
                        stream: true
                    }
                );

                const events =
                    buffer.split('\n\n');

                buffer =
                    events.pop() || '';

                for (
                    const raw of events
                ) {

                    const type =
                        (
                            raw.match(
                                /^event:\s*(.+)$/m
                            ) || []
                        )[1] || 'message';

                    if (
                        type !== 'message'
                    ) {
                        continue;
                    }

                    const line =
                        raw
                            .split('\n')
                            .find(
                                x =>
                                    x.startsWith(
                                        'data:'
                                    )
                            );

                    if (!line) continue;

                    try {

                        const message =
                            JSON.parse(
                                line
                                    .slice(5)
                                    .trim()
                            );

                        appendSellerMessage(
                            message
                        );

                    } catch (_) {}
                }
            }

        } catch (e) {

            if (
                chatStreamAbort.signal
                    .aborted
            ) {
                break;
            }

            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        1500
                    )
            );
        }
    }
}


async function sendSpecialSellerMessage({ image = null, offer = null } = {}) {
    const input = document.getElementById('chatInput');
    const token = localStorage.getItem('token');
    if (image && image.size > 5 * 1024 * 1024) return alert('Ảnh chat tối đa 5MB.');
    const headers = { Authorization: 'Bearer ' + token };
    let body;
    const fields = {
        userId: currentOtherUser,
        productId: currentChatProduct,
        noiDung: offer ? 'Đề nghị mức giá này' : '',
        type: offer ? 'offer' : 'text',
        giaDeXuat: offer || ''
    };
    if (image) {
        body = new FormData();
        Object.entries(fields).forEach(([key, value]) => body.append(key, value));
        body.append('image', image);
    } else {
        headers['Content-Type'] = 'application/json';
        body = JSON.stringify(fields);
    }
    input.disabled = true;
    try {
        const response = await fetch('/api/messages', { method: 'POST', headers, body });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Không gửi được tin nhắn.');
        document.getElementById('detailImage').value = '';
        input.value = '';
        appendSellerMessage(data);
    } catch (error) {
        alert(error.message);
    } finally {
        input.disabled = false;
        input.focus();
    }
}

async function sendChat(e) {

    e.preventDefault();

    const input =
        document.getElementById(
            'chatInput'
        );

    const text =
        input?.value.trim();

    const image = document.getElementById('detailImage')?.files?.[0];
    if (image) return sendSpecialSellerMessage({ image });
    if (!text) return;

    const token =
        localStorage.getItem(
            'token'
        );

    input.disabled = true;

    try {

        const r = await fetch(
            '/api/messages',
            {
                method: 'POST',

                headers: {
                    'Content-Type':
                        'application/json',

                    Authorization:
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    userId:
                        currentOtherUser,

                    productId:
                        currentChatProduct,

                    noiDung:
                        text
                })
            }
        );

        const d = await r.json();

        if (!r.ok) {
            throw new Error(
                d.message ||
                'Không gửi được tin nhắn.'
            );
        }

        input.value = '';
 
        appendSellerMessage(d);

    } catch (e) {

        alert(e.message);

    } finally {

        input.disabled = false;
        input.focus();

    }
}
