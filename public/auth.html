<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - Chợ Đồ Cũ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: #f1f5f9; }
        .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .auth-card { width: min(100%, 560px); border: 0; border-radius: 18px; overflow: hidden; }
        .auth-header { background: #0f172a; color: #fff; padding: 28px; }
        .social-divider { display: flex; align-items: center; gap: 12px; color: #64748b; font-size: .875rem; }
        .social-divider::before, .social-divider::after { content: ""; height: 1px; flex: 1; background: #e2e8f0; }
        .social-login { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        @media (max-width: 420px) { .social-login { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <main class="auth-page">
        <section class="card auth-card shadow">
            <div class="auth-header">
                <a href="/" class="brand-logo text-white text-decoration-none"><i class="bi bi-recycle"></i> CHỢ ĐỒ CŨ</a>
                <h1 id="authTitle" class="h3 mt-4 mb-2">Đăng nhập tài khoản</h1>
                <p id="authSubtitle" class="mb-0 text-white-50">Tiếp tục mua bán đồ cũ an toàn.</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <div class="btn-group w-100 mb-4" role="group">
                    <button id="loginTab" class="btn btn-primary" type="button">Đăng nhập</button>
                    <button id="registerTab" class="btn btn-outline-primary" type="button">Đăng ký</button>
                </div>

                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại hoặc email</label>
                        <input id="loginIdentifier" class="form-control" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input id="loginPassword" type="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Đăng nhập</button>
                    <button id="forgotPasswordButton" class="btn btn-link w-100 mt-2" type="button">Quên mật khẩu?</button>
                </form>

                <form id="passwordResetForm" class="d-none">
                    <div class="mb-3">
                        <label class="form-label" for="resetEmail">Email tài khoản</label>
                        <input id="resetEmail" type="email" class="form-control" required autocomplete="email">
                    </div>
                    <button id="sendResetOtpButton" class="btn btn-outline-primary w-100" type="button">Gửi mã khôi phục</button>
                    <div id="resetOtpGroup" class="mt-3 d-none">
                        <label class="form-label" for="resetOtpCode">Mã xác thực</label>
                        <div class="input-group">
                            <input id="resetOtpCode" class="form-control" inputmode="numeric" autocomplete="one-time-code" maxlength="6">
                            <button id="verifyResetOtpButton" class="btn btn-outline-primary" type="button">Xác thực</button>
                        </div>
                    </div>
                    <div id="newPasswordGroup" class="mt-3 d-none">
                        <label class="form-label" for="resetNewPassword">Mật khẩu mới</label>
                        <input id="resetNewPassword" type="password" class="form-control mb-2" minlength="8" maxlength="72" autocomplete="new-password">
                        <label class="form-label" for="resetConfirmPassword">Nhập lại mật khẩu mới</label>
                        <input id="resetConfirmPassword" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password">
                        <button class="btn btn-primary w-100 mt-3" type="submit">Đặt lại mật khẩu</button>
                    </div>
                    <button id="backToLoginButton" class="btn btn-link w-100 mt-2" type="button">Quay lại đăng nhập</button>
                </form>

                <div id="socialLoginSection" class="my-4">
                    <div class="social-divider mb-3"><span>Hoặc tiếp tục với</span></div>
                    <div class="d-flex flex-column gap-2">
                        <button id="googleLoginButton" type="button" class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2 py-2 w-100 shadow-sm">
                            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                            <span class="fw-semibold">Đăng nhập với Google</span>
                        </button>
                        <button id="appleLoginButton" type="button" class="btn btn-dark d-none d-flex align-items-center justify-content-center gap-2 py-2 w-100 shadow-sm">
                            <i class="bi bi-apple fs-5"></i>
                            <span class="fw-semibold">Đăng nhập với Apple</span>
                        </button>
                    </div>
                </div>

                <form id="registerForm" class="d-none">
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input id="registerPhone" type="tel" class="form-control" required autocomplete="tel"
                               inputmode="numeric" pattern="0[0-9]{9}" maxlength="10"
                               title="Số điện thoại không hợp lệ">
                        <button id="checkPhoneButton" class="btn btn-outline-primary w-100 mt-2" type="button">Tiếp tục</button>
                    </div>
                    <div id="registerDetails" class="d-none">
                        <div class="mb-3">
                            <label class="form-label">Họ và tên</label>
                            <input id="registerName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input id="registerEmail" type="email" class="form-control" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu (ít nhất 8 ký tự, gồm chữ và số)</label>
                            <input id="registerPassword" type="password" minlength="8" class="form-control" required autocomplete="new-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tỉnh/thành phố</label>
                            <select id="registerProvince" class="form-select" required>
                                <option value="">Đang tải tỉnh/thành phố...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phường/xã</label>
                            <select id="registerWard" class="form-select" required disabled>
                                <option value="">Chọn tỉnh/thành phố trước</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Địa chỉ chi tiết</label>
                            <input id="registerAddress" class="form-control" required>
                        </div>
                        <div class="form-check my-3">
                        <input class="form-check-input" type="checkbox" id="registerConsent" required>
                        <label class="form-check-label small" for="registerConsent">Tôi đã đọc và đồng ý với <a href="/terms.html" target="_blank" rel="noopener">Điều khoản sử dụng</a> và <a href="/privacy.html" target="_blank" rel="noopener">Chính sách bảo mật</a>, bao gồm việc thu thập và xử lý email, số điện thoại, địa chỉ của tôi.</label>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Tạo tài khoản</button>
                    </div>
                </form>

                <div id="authMessage" class="alert d-none mt-3 mb-0"></div>
                <a href="/" class="d-block text-center mt-4 text-decoration-none">← Về trang chủ</a>
            </div>
        </section>
    </main>
    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const message = document.getElementById('authMessage');
        const title = document.getElementById('authTitle');
        const subtitle = document.getElementById('authSubtitle');
        const socialLoginSection = document.getElementById('socialLoginSection');
        const appleLoginButton = document.getElementById('appleLoginButton');
        const registerDetails = document.getElementById('registerDetails');
        const checkPhoneButton = document.getElementById('checkPhoneButton');
        const passwordResetForm = document.getElementById('passwordResetForm');
        const resetOtpGroup = document.getElementById('resetOtpGroup');
        const newPasswordGroup = document.getElementById('newPasswordGroup');
        let resetVerificationToken = '';

        function showMessage(text, type = 'danger') {
            message.textContent = text;
            message.className = `alert alert-${type} mt-3 mb-0`;
        }
        function setMode(mode) {
            const register = mode === 'register';
            loginForm.classList.toggle('d-none', register);
            registerForm.classList.toggle('d-none', !register);
            passwordResetForm.classList.add('d-none');
            document.getElementById('forgotPasswordButton').classList.toggle('d-none', register);
            loginTab.className = register ? 'btn btn-outline-primary' : 'btn btn-primary';
            registerTab.className = register ? 'btn btn-primary' : 'btn btn-outline-primary';
            title.textContent = register ? 'Tạo tài khoản mới' : 'Đăng nhập tài khoản';
            subtitle.textContent = register ? 'Đăng ký để mua bán đồ cũ dễ dàng.' : 'Tiếp tục mua bán đồ cũ an toàn.';
            document.title = register ? 'Đăng ký - Chợ Đồ Cũ' : 'Đăng nhập - Chợ Đồ Cũ';
            socialLoginSection.classList.toggle('d-none', register);
            if (!register) {
                registerDetails.classList.add('d-none');
                checkPhoneButton.disabled = false;
            }
            message.className = 'alert d-none mt-3 mb-0';
        }
        async function request(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Yêu cầu không thành công.');
            return data;
        }
        async function loadProvinces() {
            const provinceSelect = document.getElementById('registerProvince');
            try {
                const response = await fetch('https://provinces.open-api.vn/api/p/');
                if (!response.ok) throw new Error('Không thể tải danh sách tỉnh/thành phố.');
                const provinces = await response.json();
                provinceSelect.innerHTML = '<option value="">-- Chọn tỉnh/thành phố --</option>';
                provinces.sort((a, b) => a.name.localeCompare(b.name, 'vi')).forEach(province => {
                    const option = document.createElement('option');
                    option.value = province.code;
                    option.textContent = province.name;
                    provinceSelect.appendChild(option);
                });
            } catch (error) {
                provinceSelect.innerHTML = '<option value="">Không tải được danh sách</option>';
                showMessage(`${error.message} Bạn có thể tải lại trang để thử lại.`);
            }
        }
        async function loadWards(provinceCode) {
            const wardSelect = document.getElementById('registerWard');
            wardSelect.disabled = true;
            wardSelect.innerHTML = '<option value="">Đang tải phường/xã...</option>';
            if (!provinceCode) {
                wardSelect.innerHTML = '<option value="">Chọn tỉnh/thành phố trước</option>';
                return;
            }
            try {
                const response = await fetch(`https://provinces.open-api.vn/api/p/${encodeURIComponent(provinceCode)}?depth=2`);
                if (!response.ok) throw new Error('Không thể tải danh sách phường/xã.');
                const province = await response.json();
                wardSelect.innerHTML = '<option value="">-- Chọn phường/xã --</option>';
                (province.districts || []).forEach(district => {
                    (district.wards || []).forEach(ward => {
                        const option = document.createElement('option');
                        option.value = `${ward.name}, ${district.name}`;
                        option.textContent = `${ward.name} (${district.name})`;
                        wardSelect.appendChild(option);
                    });
                });
                wardSelect.disabled = wardSelect.options.length <= 1;
            } catch (error) {
                wardSelect.innerHTML = '<option value="">Không tải được danh sách</option>';
                showMessage(`${error.message} Bạn có thể tải lại trang để thử lại.`);
            }
        }
        loginTab.onclick = () => setMode('login');
        registerTab.onclick = () => setMode('register');
        document.getElementById('forgotPasswordButton').onclick = () => {
            loginForm.classList.add('d-none');
            passwordResetForm.classList.remove('d-none');
            document.getElementById('socialLoginSection').classList.add('d-none');
            message.className = 'alert d-none mt-3 mb-0';
        };
        document.getElementById('backToLoginButton').onclick = () => {
            passwordResetForm.classList.add('d-none');
            loginForm.classList.remove('d-none');
            document.getElementById('socialLoginSection').classList.remove('d-none');
            resetVerificationToken = '';
            message.className = 'alert d-none mt-3 mb-0';
        };
        document.getElementById('sendResetOtpButton').onclick = async event => {
            const button = event.currentTarget;
            button.disabled = true;
            resetVerificationToken = '';
            newPasswordGroup.classList.add('d-none');
            try {
                const data = await request('/api/auth/email-otp/send', {
                    email: document.getElementById('resetEmail').value.trim(),
                    purpose: 'reset-password'
                });
                resetOtpGroup.classList.remove('d-none');
                showMessage(data.message, 'success');
            } catch (error) {
                showMessage(error.message);
            } finally {
                button.disabled = false;
            }
        };
        document.getElementById('verifyResetOtpButton').onclick = async event => {
            const button = event.currentTarget;
            button.disabled = true;
            try {
                const data = await request('/api/auth/email-otp/verify', {
                    email: document.getElementById('resetEmail').value.trim(),
                    purpose: 'reset-password',
                    code: document.getElementById('resetOtpCode').value.trim()
                });
                resetVerificationToken = data.verificationToken;
                newPasswordGroup.classList.remove('d-none');
                showMessage(data.message, 'success');
            } catch (error) {
                resetVerificationToken = '';
                newPasswordGroup.classList.add('d-none');
                showMessage(error.message);
            } finally {
                button.disabled = false;
            }
        };
        document.getElementById('resetEmail').addEventListener('input', () => {
            resetVerificationToken = '';
            newPasswordGroup.classList.add('d-none');
        });
        passwordResetForm.onsubmit = async event => {
            event.preventDefault();
            const password = document.getElementById('resetNewPassword').value;
            if (!resetVerificationToken) return showMessage('Vui lòng xác thực mã email trước.');
            if (password !== document.getElementById('resetConfirmPassword').value) {
                return showMessage('Mật khẩu nhập lại không khớp.');
            }
            try {
                const data = await request('/api/auth/password-reset', {
                    email: document.getElementById('resetEmail').value.trim(),
                    verificationToken: resetVerificationToken,
                    newPassword: password
                });
                resetVerificationToken = '';
                passwordResetForm.classList.add('d-none');
                loginForm.classList.remove('d-none');
                document.getElementById('socialLoginSection').classList.remove('d-none');
                showMessage(data.message, 'success');
            } catch (error) {
                showMessage(error.message);
            }
        };
        checkPhoneButton.onclick = async () => {
            const phone = document.getElementById('registerPhone').value.trim();
            if (!/^0\d{9}$/.test(phone)) {
                showMessage('Số điện thoại không hợp lệ.');
                return;
            }
            checkPhoneButton.disabled = true;
            checkPhoneButton.textContent = 'Đang kiểm tra...';
            try {
                const phoneCheck = await request('/api/auth/check-phone', { soDienThoai: phone });
                if (phoneCheck.exists) {
                    throw new Error('Số điện thoại này đã được đăng ký.');
                }
                sessionStorage.setItem('registrationPhone', phone);
                window.location.href = '/auth-register.html';
            } catch (error) {
                showMessage(error.message);
            } finally {
                checkPhoneButton.disabled = false;
                checkPhoneButton.textContent = 'Kiểm tra lại số điện thoại';
            }
        };
        document.getElementById('registerPhone').addEventListener('input', () => {
            const phoneInput = document.getElementById('registerPhone');
            phoneInput.value = phoneInput.value.replace(/\D/g, '').slice(0, 10);
            registerDetails.classList.add('d-none');
            checkPhoneButton.textContent = 'Tiếp tục';
            message.className = 'alert d-none mt-3 mb-0';
        });
        document.getElementById('registerProvince').addEventListener('change', event => {
            loadWards(event.target.value);
        });
        const googleBtn = document.getElementById('googleLoginButton');
        const appleBtn = document.getElementById('appleLoginButton');
        const isAppleDevice = /iPhone|iPad|iPod|Macintosh|Mac OS X/i.test(navigator.userAgent) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (appleBtn) {
            if (isAppleDevice) {
                appleBtn.classList.remove('d-none');
            } else {
                appleBtn.classList.add('d-none');
            }
        }

        async function executeSocialLogin(provider) {
            try {
                let defaultEmail = provider === 'apple' ? 'user@icloud.com' : 'user@gmail.com';
                let email = prompt(`Đăng nhập nhanh bằng ${provider === 'apple' ? 'Apple ID' : 'Google'}.\nNhập email tài khoản:`, defaultEmail);
                if (!email) return;
                let name = prompt('Nhập họ tên hiển thị của bạn:', provider === 'apple' ? 'Apple User' : 'Google User');
                const data = await request('/api/auth/social-login', {
                    provider,
                    email: email.trim(),
                    hoTen: name ? name.trim() : (provider === 'apple' ? 'Apple User' : 'Google User'),
                    id: provider + '_' + Date.now(),
                    avatar: null
                });
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                showMessage(data.message, 'success');
                setTimeout(() => { window.location.href = '/'; }, 600);
            } catch (err) {
                showMessage(err.message);
            }
        }

        if (googleBtn) googleBtn.onclick = () => executeSocialLogin('google');
        if (appleBtn) appleBtn.onclick = () => executeSocialLogin('apple');
        loginForm.onsubmit = async event => {
            event.preventDefault();
            try {
                const data = await request('/api/auth/login', {
                    identifier: document.getElementById('loginIdentifier').value.trim(),
                    matKhau: document.getElementById('loginPassword').value
                });
                const tokenValue = data.token || '';
                const userValue = data.user || data.profile || data;
                if (!tokenValue || !userValue) throw new Error('Đăng nhập thành công nhưng dữ liệu tài khoản không hợp lệ.');
                localStorage.setItem('token', tokenValue);
                localStorage.setItem('user', JSON.stringify(userValue));
                window.location.href = '/';
            } catch (error) {
                showMessage(error.message);
            }
        };
        registerForm.onsubmit = async event => {
            event.preventDefault();
            try {
                const phone = document.getElementById('registerPhone').value.trim();
                if (registerDetails.classList.contains('d-none')) {
                    throw new Error('Vui lòng kiểm tra số điện thoại trước.');
                }
                const provinceSelect = document.getElementById('registerProvince');
                const wardSelect = document.getElementById('registerWard');
                const data = await request('/api/auth/register', {
                    hoTen: document.getElementById('registerName').value.trim(),
                    email: document.getElementById('registerEmail').value.trim(),
                    soDienThoai: phone,
                    matKhau: document.getElementById('registerPassword').value,
                    tinhThanh: provinceSelect.options[provinceSelect.selectedIndex]?.textContent.trim(),
                    phuongXa: wardSelect.value.trim(),
                    quanHuyen: null,
                    diaChiChiTiet: document.getElementById('registerAddress').value.trim(),
                    dongYDieuKhoan: document.getElementById('registerConsent').checked
                });
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/';
            } catch (error) {
                showMessage(error.message);
            }
        };
        loadProvinces();
        setMode(new URLSearchParams(window.location.search).get('mode') === 'register' ? 'register' : 'login');
    </script>
<script src="/js/site-config.js"></script>
    <script src="/js/footer.js"></script>
</body>
</html>
